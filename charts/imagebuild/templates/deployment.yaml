apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "imagebuild.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "imagebuild.labels" . | nindent 4 }}
    control-plane: controller-manager
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "imagebuild.selectorLabels" . | nindent 6 }}
  # Only one manager may run without leader election, so replace it in place.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        {{- include "imagebuild.labels" . | nindent 8 }}
        control-plane: controller-manager
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "imagebuild.fullname" . }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: manager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --metrics-bind-address=0
            - --health-probe-bind-address=:8081
            - --leader-elect={{ .Values.leaderElection }}
            - --registry={{ .Values.config.registry }}
            - --registry-insecure={{ .Values.config.registryInsecure }}
            - --builder-image={{ .Values.config.builderImage }}
            - --git-image={{ .Values.config.gitImage }}
            - --seccomp-profile={{ .Values.config.seccompProfile }}
            {{- range $host, $mirror := .Values.config.registryMirrors }}
            - --registry-mirror={{ $host }}={{ $mirror }}
            {{- end }}
            {{- range .Values.config.excludeNodes }}
            - --exclude-node={{ . }}
            {{- end }}
            {{- with .Values.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
